<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>InmoBot – Logo Animado</title>
  <style>

    /* ══════════════════════════════════════════
       AJUSTE DE POSICIÓN Y TAMAÑO DE LOS DOTS
       Si los dots no quedan centrados en la lente:
         --dot-y   → subí el % para bajarlos, bajalo para subirlos
         --dot-gap → separación entre dots (px)
         --dot-size→ tamaño de cada dot (px)
    ══════════════════════════════════════════ */
    :root {
      --logo-size: 320px;
      --dot-size:  14px;
      --dot-y:     51%;    /* % desde el top del logo — ajustá acá para centrar en la lente */
      --dot-gap:   22px;   /* distancia centro-a-centro entre dots adyacentes */
      --bounce:    6px;    /* cuánto sube cada dot */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0B1A2F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .logo-wrapper {
      position: relative;
      width:  var(--logo-size);
      height: var(--logo-size);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ── Dots ── */
    .dot {
      position: absolute;
      z-index: 2;
      width:  var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: #5EBBE7;
      top: calc(var(--dot-y) - var(--dot-size) / 2);
    }

    .dot-1 { left: calc(50% - var(--dot-gap) - var(--dot-size) / 2); }
    .dot-2 { left: calc(50%                  - var(--dot-size) / 2); }
    .dot-3 { left: calc(50% + var(--dot-gap) - var(--dot-size) / 2); }

    /* Bounce rápido tipo widget "pensando" */
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0);                    opacity: 0.5; }
      30%           { transform: translateY(calc(var(--bounce) * -1)); opacity: 1;   }
    }

    .dot-1 { animation: bounce 0.9s ease-in-out infinite 0s;    }
    .dot-2 { animation: bounce 0.9s ease-in-out infinite 0.18s; }
    .dot-3 { animation: bounce 0.9s ease-in-out infinite 0.36s; }

  </style>
</head>
<body>

  <div class="logo-wrapper">
    <img
      class="logo-img"
      src="Logos-Nuevos-Inmobot/Logo_SinPuntos_Inmobot.png"
      alt="InmoBot"
    />
    <div class="dot dot-1"></div>
    <div class="dot dot-2"></div>
    <div class="dot dot-3"></div>
  </div>

</body>
</html>
